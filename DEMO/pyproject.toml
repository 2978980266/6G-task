[project]
name = "skylines-dualmind-demo"
version = "0.1.0"
description = "Modular DEMO environment for a Cities: Skylines recreation of the Dual-Mind wireless task."
readme = {text = "Cities: Skylines trajectory-based V2X experiments with task-aware packet CAoI, independent perception-risk communication, and a dedicated risk scheduler. Full usage and experiment documentation is maintained in the repository-root README.md.", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29,<1.1",
    "numpy>=1.24,<3",
    "stable-baselines3>=2.3,<3",
    "torch>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
