[project]
name = "skylines-dualmind-demo"
version = "0.1.0"
description = "Modular DEMO environment for a Cities: Skylines recreation of the Dual-Mind wireless task."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29,<1.1",
    "numpy>=1.24,<3",
    "stable-baselines3>=2.3,<3",
    "torch>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
