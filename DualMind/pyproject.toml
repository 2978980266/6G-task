[project]
name = "dualmind"
version = "0.1.0"
description = "Stage 1 baseline for a Dual-Mind-inspired wireless scheduling experiment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29,<1.1",
    "numpy>=1.24,<3",
    "stable-baselines3>=2.3,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
